# SellMix — Nginx configuration
# Place at: /etc/nginx/sites-available/sellmix
# Then: sudo ln -s /etc/nginx/sites-available/sellmix /etc/nginx/sites-enabled/
#
# NOTE: the "managed by Certbot" lines below are not decorative — they are
# real, load-bearing SSL config that Certbot wrote directly onto the live
# server (via `certbot --nginx`), not by editing this repo file. This copy
# was captured FROM the live server on 2026-08-30 so that this file and
# reality match. Do NOT hand-edit the Certbot-managed blocks; if you need to
# change something in this file and redeploy it with `cp ... && systemctl
# reload nginx`, diff it against the live file first — overwriting the live
# config with a version that's missing these blocks takes the site down
# (this happened once already).

# ─── Upstream Backend ─────────────────────────────────────────────────────────
upstream sellmix_api {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ─── Rate limiting zones ───────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

# ─── sellmix.pk — Customer Web App ───────────────────────────────────────────
server {
    server_name sellmix.pk www.sellmix.pk;

    root /var/www/sellmix/customer-web;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache static assets (JS/CSS/images have content-hash filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA — all routes to index.html
    location / {
        try_files $uri /index.html;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to backend
    location /api {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://sellmix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy uploaded images (local uploads)
    location /uploads {
        proxy_pass http://sellmix_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sellmix.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sellmix.pk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ─── admin.sellmix.pk — Admin Dashboard ──────────────────────────────────────
server {
    server_name admin.sellmix.pk;

    root /var/www/sellmix/web-frontend;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA routing
    location / {
        try_files $uri /index.html;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "no-cache";
    }

    # API proxy
    location /api {
        proxy_pass http://sellmix_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /uploads {
        proxy_pass http://sellmix_api;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sellmix.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sellmix.pk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ─── api.sellmix.pk — Backend API (for mobile app) ───────────────────────────
server {
    server_name api.sellmix.pk;

    # Product images now live here too (self-hosted, see backend/routes/images.js) —
    # a single page load fires dozens of these, so they must stay outside the
    # api rate-limit zone below or normal browsing trips it (503s, seen live 2026-08-30).
    location /uploads {
        proxy_pass http://sellmix_api;
        proxy_set_header Host $host;
        expires 7d;
    }

    location / {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://sellmix_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sellmix.pk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sellmix.pk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# ─── HTTP → HTTPS redirects (added by Certbot) ───────────────────────────────
server {
    if ($host = www.sellmix.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = sellmix.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name sellmix.pk www.sellmix.pk;
    return 404; # managed by Certbot
}

server {
    if ($host = admin.sellmix.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.sellmix.pk;
    return 404; # managed by Certbot
}

server {
    if ($host = api.sellmix.pk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.sellmix.pk;
    return 404; # managed by Certbot
}
